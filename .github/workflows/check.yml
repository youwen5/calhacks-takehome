name: Verify portal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: nix develop --command pnpm install --frozen-lockfile
      - run: nix develop --command pnpm format:check
      - run: nix develop --command pnpm check
      - run: nix develop --command pnpm test
      - run: nix develop --command pnpm test:e2e
      - run: nix build .#docker-image -o result-image
      - run: docker load -i result-image
      - run: CONTAINER_ENGINE=docker nix develop --command pnpm test:container
