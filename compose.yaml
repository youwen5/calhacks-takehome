name: colmena
services:
  portal:
    image: ${PORTAL_IMAGE:-ghcr.io/youwen5/calhacks-takehome@sha256:91b56e3896375630d28b1b9aacdfd133d7582ec7ad3ed06f8d466d6461a72e6e}
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${PORTAL_PORT:-3000}:3000'
    volumes:
      - portal-data:/data
    environment:
      DATABASE_PATH: /data/portal.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS origin in .env.production}
      ORIGIN: ${BETTER_AUTH_URL:?Set the public HTTPS origin in .env.production}
      MAIL_MODE: disabled
      DEMO_EMAIL_VERIFICATION: 'true'
      DEMO_ACCOUNTS: 'true'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/events').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  portal-data:
